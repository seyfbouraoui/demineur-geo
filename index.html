<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GéoDémineur – Prospection des aléas</title>
<style>
:root{--bg:#f4efe6;--card:#fffdf8;--tx:#2b2118;--mut:#7a6a58;--cov:#c8a97e;--cov2:#b8956a;--rev:#e9ddc8;--bd:#d6c5a8;--ac:#b5451b;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--card:#262019;--tx:#f0e6d6;--mut:#a89883;--cov:#6b5238;--cov2:#5a432e;--rev:#3a3125;--bd:#4a3d2c;--ac:#e8794a;--ok:#5fc287}}
:root[data-theme="dark"]{--bg:#1c1814;--card:#262019;--tx:#f0e6d6;--mut:#a89883;--cov:#6b5238;--cov2:#5a432e;--rev:#3a3125;--bd:#4a3d2c;--ac:#e8794a;--ok:#5fc287}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;display:flex;justify-content:center}
.app{width:100%;max-width:980px}
h1{font-size:1.4rem;margin:0 0 2px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;font-weight:600}
button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{overflow-x:auto;padding-bottom:6px}
#board{display:grid;gap:2px;background:var(--bd);border:2px solid var(--bd);border-radius:8px;width:max-content;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s)*.55);background:linear-gradient(145deg,var(--cov),var(--cov2));cursor:pointer;line-height:1}
.c:hover{filter:brightness(1.1)}
.c.r{background:var(--rev);cursor:default;filter:none}
.c.boom{background:var(--ac)}
.c.bad{background:#b02a2a;color:#fff}
.msg{margin:12px 0;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--bd);min-height:48px;font-size:.95rem}
.msg.win{border-color:var(--ok)}.msg.lose{border-color:var(--ac)}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;font-size:.85rem;color:var(--mut);margin-top:10px}
.leg b{color:var(--tx)}
.n1{color:#2a6fb0}.n2{color:#2f7d4f}.n3{color:#c28a00}.n4{color:#d0601f}.n5{color:#c0392b}.n6{color:#a0285a}.n7{color:#7a2d9a}.n8{color:#444}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .n1{color:#6fb0f0}:root:not([data-theme="light"]) .n2{color:#6fd194}:root:not([data-theme="light"]) .n8{color:#ccc}}

.top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.top .ttl{flex:1;min-width:0}
.logo{height:64px;width:auto;border-radius:10px;background:#fff;padding:4px;border:1px solid var(--bd);flex:none}
footer{margin-top:18px;padding-top:12px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px;color:var(--mut);font-size:.88rem}
footer .logo{height:44px}
footer b{color:var(--tx)}
@media (max-width:520px){.logo{height:48px}}
#board,.wrap{direction:ltr}
</style>
</head>

 facts:["La croûte continentale fait en moyenne 35 km d’épaisseur, contre 7 km pour la croûte océanique.","Une anomalie de Bouguer négative signale souvent un déficit de masse : bassin sédimentaire ou cavité.","Le krigeage fournit non seulement une estimation mais aussi sa variance d’erreur.","Les interférogrammes DInSAR détectent des déformations du sol de l’ordre du centimètre, voire du millimètre.","Les ondes P sont plus rapides que les ondes S, ce qui permet de localiser l’épicentre d’un séisme.","La magnitude d’un séisme est logarithmique : +1 de magnitude ≈ 32 fois plus d’énergie libérée."]},

const $=id=>document.getElementById(id);
let L=(navigator.language||"fr").slice(0,2);if(!T[L])L="fr";
try{const sv=localStorage.getItem("gd_lang");if(sv&&T[sv])L=sv;}catch(e){}
let R,C,M,G,over,started,flags,revealed,timer,secs=0,flagMode=false;
let curMsg={f:()=>"",k:""};

function setMsg(f,k){curMsg={f,k};renderMsg();}
function renderMsg(){const m=$("msg");m.textContent=curMsg.f();m.className="msg "+curMsg.k;}
function showTime(){$("time").textContent="⏱️ "+secs+" "+T[L].s;}

function applyLang(){
  const t=T[L];
  document.documentElement.lang=L;
  document.documentElement.dir=L==="ar"?"rtl":"ltr";
  document.title=t.doc;
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.innerHTML=t[e.dataset.i18n];});
  $("mode").textContent=flagMode?t.modeFlag:t.modeDig;
  $("mode").title=t.modeTip;
  $("lang").value=L;
  $("leg").innerHTML=t.hz.map((h,i)=>`<div>${HZE[i]} <b>${h[0]}</b></div>`).join("")+`<div>📡 <b>${t.sis}</b> ${t.sisd}</div>`;
  showTime();renderMsg();
}

function nb(r,c){const a=[];for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){if(!i&&!j)continue;const y=r+i,x=c+j;if(y>=0&&y<R&&x>=0&&x<C)a.push([y,x]);}return a;}

function init(){
  [R,C,M]=$("lvl").value.split(",").map(Number);
  G=Array.from({length:R},()=>Array.from({length:C},()=>({m:0,h:0,n:0,f:0,r:0})));
  over=false;started=false;flags=0;revealed=0;secs=0;clearInterval(timer);
  showTime();
  setMsg(()=>T[L].start,"");
  const s=Math.max(24,Math.min(36,Math.floor((Math.min(innerWidth,980)-44)/C)));
  const b=$("board");b.style.setProperty("--s",s+"px");
  b.style.gridTemplateColumns=`repeat(${C},var(--s))`;
  b.innerHTML="";
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const d=document.createElement("div");d.className="c";d.id=`c${r}_${c}`;
    d.dataset.r=r;d.dataset.c=c;b.appendChild(d);
  }
  upd();
}
function upd(){$("mines").textContent="📡 "+(M-flags);}

function place(sr,sc){
  const ban=new Set([sr+"_"+sc,...nb(sr,sc).map(p=>p.join("_"))]);
  let k=0;
  while(k<M){
    const r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C);
    if(G[r][c].m||ban.has(r+"_"+c))continue;
    G[r][c].m=1;G[r][c].h=Math.floor(Math.random()*HZE.length);k++;
  }
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)G[r][c].n=nb(r,c).filter(([y,x])=>G[y][x].m).length;
  started=true;
  timer=setInterval(()=>{secs++;showTime();},1000);
}

function draw(r,c){
  const g=G[r][c],d=$(`c${r}_${c}`);
  d.className="c"+(g.r?" r":"");d.textContent="";
  if(g.r){if(g.n){d.textContent=g.n;d.classList.add("n"+g.n);}}
  else if(g.f)d.textContent="📡";
}

function reveal(r,c){
  const st=[[r,c]];
  while(st.length){
    const [y,x]=st.pop(),g=G[y][x];
    if(g.r||g.f)continue;
    g.r=1;revealed++;draw(y,x);
    if(!g.n)nb(y,x).forEach(p=>st.push(p));
  }
}

function lose(r,c){
  over=true;clearInterval(timer);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const g=G[y][x],d=$(`c${y}_${x}`);
    if(g.m&&!g.f){d.className="c r";d.textContent=HZE[g.h];}
    else if(!g.m&&g.f){d.className="c bad";d.textContent="❌";}
  }
  const hi=G[r][c].h,sc=secs,d=$(`c${r}_${c}`);
  d.className="c boom";d.textContent=HZE[hi];
  setMsg(()=>T[L].lose(T[L].hz[hi][0],T[L].hz[hi][1],sc),"lose");
}

function checkWin(){
  if(revealed===R*C-M){
    over=true;clearInterval(timer);
    for(let y=0;y<R;y++)for(let x=0;x<C;x++){const g=G[y][x];if(g.m&&!g.f){g.f=1;draw(y,x);}}
    flags=M;upd();
    const fi=Math.floor(Math.random()*6),sc=secs;
    setMsg(()=>T[L].win(sc,T[L].facts[fi]),"win");
  }
}

function dig(r,c){
  if(over)return;
  const g=G[r][c];
  if(g.f)return;
  if(!started)place(r,c);
  if(g.r){
    if(!g.n)return;
    const ns=nb(r,c);
    if(ns.filter(([y,x])=>G[y][x].f).length!==g.n)return;
    for(const [y,x] of ns){
      if(G[y][x].f||G[y][x].r)continue;
      if(G[y][x].m){lose(y,x);return;}
      reveal(y,x);
    }
    checkWin();return;
  }
  if(g.m){lose(r,c);return;}
  reveal(r,c);checkWin();
}

function flag(r,c){
  if(over)return;
  const g=G[r][c];if(g.r)return;
  g.f=g.f?0:1;flags+=g.f?1:-1;draw(r,c);upd();
}

const B=$("board");let pt=null,long=false;
function cell(e){const t=e.target.closest(".c");return t?[+t.dataset.r,+t.dataset.c]:null;}
B.addEventListener("contextmenu",e=>{e.preventDefault();const p=cell(e);if(p)flag(...p);});
B.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  const p=cell(e);if(!p)return;long=false;
  pt=setTimeout(()=>{long=true;flag(...p);if(navigator.vibrate)navigator.vibrate(30);},450);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>B.addEventListener(ev,()=>clearTimeout(pt)));
B.addEventListener("click",e=>{
  if(long){long=false;return;}
  const p=cell(e);if(!p)return;
  flagMode?flag(...p):dig(...p);
});
$("new").onclick=init;$("lvl").onchange=init;
$("mode").onclick=()=>{flagMode=!flagMode;$("mode").className=flagMode?"on":"";applyLang();};
$("lang").onchange=()=>{L=$("lang").value;try{localStorage.setItem("gd_lang",L);}catch(e){}applyLang();};

init();applyLang();
</script>
</body>
</html>
